<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Megamesh: the public internet sees three doors — SSH, WireGuard and HTTPS — everything else is dropped. Behind them, a WireGuard tunnel, wg-easy and Caddy on a 1 GB VPS.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#131a22"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88171a" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#e3120b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#88171a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- title -->
  <g transform="translate(60,40) scale(1.1)"><path fill="#E5000A" fill-rule="evenodd" d="M8 10 H18.5 L32 26.5 L45.5 10 H56 V36 C56 47 46 55 32 59 C18 55 8 47 8 36 Z M20 30 L32 44 L44 30 V37.5 C44 44 38 48.5 32 51 C26 48.5 20 44 20 37.5 Z"/></g>
  <text x="138" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f4f4f2">megamesh<tspan fill="#E5000A">.sh</tspan></text>
  <text x="138" y="134" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b9c0c8">Your own WireGuard VPN, one IP and root away.</text>
  <text x="1140" y="96" text-anchor="end" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5c6771">a megastack.sh build</text>

  <!-- the wall -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="520" height="160" rx="10" fill="#161d26" stroke="#2a333e"/>
    <text x="20" y="30" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7f8a96">PUBLIC INTERNET -- public zone, target DROP</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <rect x="20" y="48" width="150" height="40" rx="6" fill="#0f141a" stroke="#3b9b5f"/>
      <text x="34" y="73" fill="#9fe0b4">tcp/22   ssh</text>
      <rect x="185" y="48" width="150" height="40" rx="6" fill="#0f141a" stroke="#e3120b"/>
      <text x="199" y="73" fill="#ffb3ae">udp/51820 wg</text>
      <rect x="350" y="48" width="150" height="40" rx="6" fill="#0f141a" stroke="#3b7dd8"/>
      <text x="364" y="73" fill="#a9c8f5">tcp/443 https</text>
      <text x="20" y="120" fill="#5c6771" font-size="13">everything else</text><line x1="150" y1="116" x2="400" y2="116" stroke="#5c6771" stroke-dasharray="4 4"/><polygon points="400,112 410,116 400,120" fill="#5c6771"/><text x="420" y="120" fill="#5c6771" font-size="13">/dev/null</text>
      <text x="20" y="142" fill="#5c6771" font-size="13">icmp: ping + path-mtu only</text>
    </g>
  </g>

  <!-- tunnel -->
  <g transform="translate(600,236)">
    <rect x="0" y="0" width="120" height="48" fill="url(#tunnel)"/>
    <path d="M0 0 H120 M0 48 H120" stroke="#e3120b" stroke-opacity="0.6" stroke-dasharray="6 6"/>
    <text x="60" y="30" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f4f4f2">wg0</text>
  </g>

  <!-- inside -->
  <g transform="translate(740,180)">
    <rect x="0" y="0" width="400" height="160" rx="10" fill="#161d26" stroke="#2a333e"/>
    <text x="20" y="30" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7f8a96">INSIDE -- one small VPS, 1 vCPU / 1 GB</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#d5dbe2">
      <text x="20" y="62">wg-easy v15</text><text x="170" y="62">admin UI, QR codes, peers</text>
      <text x="20" y="88">caddy</text><text x="170" y="88">auto-TLS, 443 only, h1/h2</text>
      <text x="20" y="114">fail2ban</text><text x="170" y="114">key-only ssh, bans in 3 tries</text>
      <text x="20" y="140">topgrade</text><text x="170" y="140">weekly, health-checked, rollback</text>
    </g>
  </g>

  <text x="1140" y="400" text-anchor="end" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5c6771">megamesh.sh - github.com/paulfxyz/megamesh - MIT</text>
</svg>
