<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="megamesh logo: a hexagonal mesh of nodes with one red tunnel running through it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#1a222c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- mesh edges -->
  <g stroke="#3a4654" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M128 48 L190 84 L190 156 L128 192 L66 156 L66 84 Z"/>
    <path d="M128 48 L128 120 M190 84 L128 120 M66 84 L128 120 M128 120 L128 192 M190 156 L128 120 M66 156 L128 120"/>
  </g>
  <!-- the tunnel: one edge lit red, from outside in -->
  <path d="M28 120 L128 120" stroke="#e3120b" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M28 120 L128 120" stroke="#ff6b61" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- nodes -->
  <g fill="#f4f4f2">
    <circle cx="128" cy="48" r="9"/>
    <circle cx="190" cy="84" r="9"/>
    <circle cx="190" cy="156" r="9"/>
    <circle cx="128" cy="192" r="9"/>
    <circle cx="66" cy="156" r="9"/>
    <circle cx="66" cy="84" r="9"/>
  </g>
  <circle cx="128" cy="120" r="14" fill="#e3120b" filter="url(#glow)"/>
  <circle cx="128" cy="120" r="6" fill="#f4f4f2"/>
</svg>
